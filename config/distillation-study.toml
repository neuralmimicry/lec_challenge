# A finite catalogue, not a claim that every arm has run or every published
# distillation algorithm is represented. Unavailable arms retain precise reasons.
schema_version = 1
student_base_model = "Qwen/Qwen2.5-Coder-0.5B-Instruct"
signals = ["sequence_sft", "soft_token_kl", "hidden_feature", "attention_relation"]
contents = ["process", "tool_trajectory", "context", "preference"]
policies = ["offline", "on_policy"]
students = ["conventional_qwen_lora", "ternary_bitnet"]
progressive = [false, true]
self_distillation = [false, true]
seeds = [1729, 2718]
minimum_teachers = 1
maximum_teachers = 3
maximum_catalogue_arms = 200000

# The official ternary centres require enough movement to change effective
# trits. This is declared before outcomes; it is not a silent runtime adjustment.
[[student_training]]
student = "ternary_bitnet"
quick_learning_rate = 0.005
full_learning_rate = 0.005

[quick]
# Three TOTAL updates permit at least one update per progressive teacher stage.
# This fidelity verifies executable operators; it cannot establish learning gain.
steps = 3
max_sequence_tokens = 64
sequence_policy = "assistant_window"
rank = 2
alpha = 4.0
learning_rate = 0.0002
temperature = 2.0
dpo_beta = 0.1
maximum_trials = 24
maximum_total_steps = 72
timeout_seconds = 1800

[full]
# Full arms are selected using a separately frozen development-only decision.
steps = 48
max_sequence_tokens = 512
sequence_policy = "reject_overlength"
rank = 8
alpha = 16.0
learning_rate = 0.0002
temperature = 2.0
dpo_beta = 0.1
maximum_trials = 8
maximum_total_steps = 384
timeout_seconds = 14400
