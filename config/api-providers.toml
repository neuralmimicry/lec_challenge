# General inference only. Disabled, unpriced and zero-budget until configured.
# Keep secrets in the named environment variables. See docs/api-providers.md.
max_parallel_tasks = 2

[budgets]
round_nanos = 0
task_nanos = 0
provider_nanos = 0
model_nanos = 0
[budgets.tokens]
round = 0
task = 0
provider = 0
model = 0

[[providers]]
id = "openai"
business_id = "openai"
api = "openai_responses"
inference_only = true
enabled = false
endpoint = "https://api.openai.com/v1/responses"
api_key_environment = "OPENAI_API_KEY"
model = "UNRESOLVED_CODEX_MODEL"
model_revision = "UNRESOLVED_MODEL_REVISION_POLICY"
timeout_seconds = 60
requests_per_minute = 10
tokens_per_minute = 100000
concurrency = 1
max_input_tokens = 8192
max_output_tokens = 1024
output_cap_parameter = "max_output_tokens"
output_cap_includes_reasoning = true
max_response_bytes = 1048576
retries = 1
circuit_breaker_failures = 2
circuit_breaker_seconds = 30
failover = ["gemini", "claude"]
[providers.permission]
approved_for_output_training = false
decision_id = "INFERENCE_ONLY_NO_TRAINING_CLEARANCE"
reviewed_at = ""
evidence_sha256 = ""
model_licence = ""

