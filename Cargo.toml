[package]
name = "lec-distil"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Auditable, native Rust coding-model distillation assessment"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
httpdate = "1.0"
libc = "0.2"
rand = "0.9"
rand_chacha = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
quote = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
statrs = "0.18"
syn = { version = "2.0", features = ["full"] }
tempfile = "3.27"
thiserror = "2.0"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
tokio = { version = "1.53", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit", "timeout", "load-shed"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.22", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
